<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입자 효과 최소 예제</title><style>body{background:#101a21;color:#e0e9e0;font:16px monospace;margin:20px}canvas{max-width:100%;height:auto;background:#17232b;touch-action:manipulation}button,input{margin:12px}a{color:#9eddb9}</style><h1>입자 효과 최소 예제</h1><p>버튼이나 화면을 누르면 입자가 퍼집니다. 개수를 12→30으로 바꿔 비교하세요.</p><label>개수 <input id="count" type="range" min="5" max="50" value="12"><output id="value">12</output></label><button id="burst">입자 생성</button><div><canvas id="particles" width="640" height="400"></canvas></div><p><a href="https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API/Tutorial/Basic_animations">MDN Canvas 애니메이션</a> · <a href="index.html">게임으로</a></p><script>
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');let particles=[],last=0;
function burst(x=320,y=200){for(let i=0;i<Number(document.getElementById('count').value);i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1});}}
document.getElementById('burst').onclick=()=>burst();
document.getElementById('count').oninput=e=>document.getElementById('value').textContent=e.target.value;
canvas.onpointerdown=e=>{const r=canvas.getBoundingClientRect();burst((e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height);};
function loop(now){const dt=Math.min((now-last)/1000||0,.05);last=now;ctx.clearRect(0,0,640,400);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#83c6a0';ctx.fillRect(p.x,p.y,4,4);}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>

<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CURSED EDGE — 저주받은 칼날</title><link rel="stylesheet" href="style.css?v=20261112-polish"></head>
<body class="intro">
<canvas id="game" tabindex="0" aria-label="저주받은 칼날 게임 경기장">Canvas를 지원하는 브라우저에서 실행해 주세요.</canvas>
<header><div><strong id="stage">성 밖 묘지</strong><span id="wave">WAVE 1 / 3</span></div><nav aria-label="게임 설정"><button id="pause" aria-label="일시정지">일시정지</button><button id="mute" aria-pressed="false">소리 ON</button><button id="fullscreen">전체화면</button></nav></header>
<div id="boss" hidden><span>저주받은 왕</span><div><i id="bossFill"></i></div></div>
<div id="notice" role="status"></div><div id="countdown" hidden aria-live="polite"></div><div id="impact" aria-hidden="true"></div>
<footer><div class="vitals"><span>생명</span><strong id="hp">5 / 5</strong><div id="hearts" aria-hidden="true"></div></div><div class="abilities"><span id="parryStatus">패링 준비</span><div><i id="parryFill"></i></div><small id="dashStatus">검 베기 · 자동</small></div><div class="score"><span id="combo">PARRY × 0</span><strong id="score">000000</strong><small id="timer">0:00</small></div></footer>
<div id="gesturePad" hidden aria-hidden="true"><i></i></div><p id="gestureTip">조준한 방향으로 패링 · 검 베기는 자동</p>
<section id="overlay" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="heading"><canvas id="logo" width="240" height="76" aria-hidden="true"></canvas><h1 id="heading" class="sr-only">CURSED EDGE</h1><h2 id="subtitle">저주받은 칼날</h2><p id="description">제자리를 지키고, 공격이 오는 방향을 겨눠라.<br>너를 향한 저주가 너의 무기가 된다.</p><div id="choices" hidden></div><div id="help"><p>끌어서 방향 조준 · 손을 떼면 패링<br>PC는 마우스로 조준하고 클릭하세요.</p><p class="hint">키보드: 방향키/WASD 조준 · Space 패링<br>앞쪽의 공격만 막을 수 있습니다.</p></div><button id="start" class="primary">성문을 열다</button><button id="back">게임 선택으로</button><p id="best">최고 기록 0</p></section>
<script type="module" src="game.js?v=20261112-polish"></script>
</body></html>

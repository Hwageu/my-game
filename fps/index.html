<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID BREACH</title><link rel="stylesheet" href="fps.css"></head><body>
<div id="view"></div><div id="vignette"></div><div id="damage"></div><div id="crosshair">+</div>
<header><b>VOID / BREACH</b><span id="objective">시설 전력 복구 0 / 3</span><button id="fullscreen">전체화면</button><button id="mute">소리 ON</button></header>
